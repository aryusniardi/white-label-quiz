AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFront + S3 Static Hosting Architecture for White-Label Quiz'

Parameters:
  ProjectName:
    Type: String
    Default: white-label-quiz
  CustomDomainName:
    Type: String
    Default: ''
    Description: '(Optional) e.g. quiz.brand.com'
  AcmCertificateArn:
    Type: String
    Default: ''
    Description: '(Optional) ACM Certificate ARN in us-east-1 for custom domain'

Conditions:
  HasCustomDomain: !Not [!Equals [!Ref CustomDomainName, '']]

Resources:
  # 1. Private S3 Bucket for Static Assets
  QuizS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # 2. CloudFront Origin Access Control (OAC)
  QuizOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${ProjectName}-OAC'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # 3. S3 Bucket Policy allowing CloudFront OAC only
  QuizBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref QuizS3Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: 's3:GetObject'
            Resource: !Sub '${QuizS3Bucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${QuizCloudFrontDistribution}'

  # 4. CloudFront Distribution
  QuizCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Comment: !Sub 'Distribution for ${ProjectName}'
        Aliases: !If [HasCustomDomain, [!Ref CustomDomainName], !Ref 'AWS::NoValue']
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref AcmCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt QuizS3Bucket.RegionalDomainName
            OriginAccessControlId: !GetAtt QuizOAC.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          # Managed-CachingOptimized policy id
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 10

Outputs:
  BucketName:
    Value: !Ref QuizS3Bucket
    Description: S3 Bucket Name
  CloudFrontDomain:
    Value: !GetAtt QuizCloudFrontDistribution.DomainName
    Description: CloudFront Distribution Domain URL
  DistributionId:
    Value: !Ref QuizCloudFrontDistribution
    Description: CloudFront Distribution ID
